name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff (linter y formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peluqueria
          POSTGRES_PASSWORD: peluqueria
          POSTGRES_DB: peluqueria
        ports:
          - 5432:5432
        # Espera a que la base acepte conexiones antes de correr los tests.
        options: >-
          --health-cmd "pg_isready -U peluqueria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0000
      DATABASE_URL: postgres://peluqueria:peluqueria@localhost:5432/peluqueria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verifica que no falten migraciones
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
